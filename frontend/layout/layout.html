<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>${self.attr.title}</title>
    <%block name="head"></%block>
</head>
<body class="${getattr(self.attr, 'body_class', '')}">
    <main>${self.main()}</main>

    % if hasattr(self, "script"):
        ${self.script()}
    % endif
</body>
</html>
